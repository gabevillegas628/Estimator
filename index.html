    <!-- The SVG is the real icon; the PNG is both the iOS home-screen icon and
         the fallback for browsers that never learned to read an SVG favicon.
         "alternate icon" is what makes the second link a fallback rather than a
         second icon competing with the first. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/apple-touch-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7A3B54" />
  </head>
